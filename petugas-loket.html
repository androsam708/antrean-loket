<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Operator Loket</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- Top Navigation -->
    <header class="bg-white border-b border-slate-200 p-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <!-- Pilihan Loket -->
            <select id="select_loket" class="border-none text-lg font-bold text-slate-900 bg-transparent focus:outline-none cursor-pointer">
                <option value="A">LOKET A / LOKET 1</option>
                <option value="B">LOKET B / LOKET 2</option>
                <option value="C">LOKET C / LOKET 3</option>
                <!-- dst sampai 10 -->
            </select>
            <span class="flex items-center gap-2 text-xs bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-medium">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-ping"></span> Terhubung
            </span>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="max-w-md mx-auto w-full p-4 my-auto">
        <div class="bg-white rounded-3xl p-8 shadow-md border border-slate-100 text-center space-y-6">
            
            <div>
                <span class="text-xs uppercase tracking-widest text-slate-400 font-bold block mb-1">Sedang Dilayani</span>
                <div class="text-8xl font-black text-slate-900 tracking-tight" id="nomor_sekarang">024</div>
            </div>

            <!-- Tombol Aksi Utama -->
            <div class="space-y-3 pt-4">
                <button onclick="panggilBerikutnya()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-200 transition text-lg tracking-wide">
                    PANGGIL BERIKUTNYA
                </button>
                
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="panggilUlang()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3 rounded-xl transition border border-slate-200/60 text-sm">
                        🔄 Panggil Ulang
                    </button>
                    <button onclick="tandaiTerlewat()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-semibold py-3 rounded-xl transition border border-rose-100 text-sm">
                        ❌ Lewati Nomor
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- Info Singkat di Bawah -->
    <footer class="p-4 text-center text-xs text-slate-400">
        ID Operator: #OP-1002 | Pastikan volume speaker aktif saat memanggil.
    </footer>
</body>
</html>
