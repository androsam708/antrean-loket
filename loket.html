<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Antrean - Panel Loket</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 500px; margin: 40px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        select, input, button { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        select:focus, input:focus { border-color: #3498db; outline: none; }
        button { background-color: #3498db; color: white; border: none; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        button:hover { background-color: #2980b9; }
        .status-box { margin-top: 20px; padding: 15px; background: #e8f4f8; border-left: 5px solid #3498db; border-radius: 4px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Panggil Antrean (Panel Loket)</h2>
    
    <div class="form-group">
        <label for="pilihLoket">Pilih Loket:</label>
        <select id="pilihLoket" onchange="cekStatusLoket()">
            <option value="Loket A / 1">Loket A / 1</option>
            <option value="Loket B / 2">Loket B / 2</option>
            <option value="Loket C / 3">Loket C / 3</option>
            <option value="Loket D / 4">Loket D / 4</option>
            <option value="Loket E / 5">Loket E / 5</option>
            <option value="Loket F / 6">Loket F / 6</option>
            <option value="Loket G / 7">Loket G / 7</option>
            <option value="Loket H / 8">Loket H / 8</option>
            <option value="Loket I / 9">Loket I / 9</option>
            <option value="Loket J / 10">Loket J / 10</option>
        </select>
    </div>

    <div class="form-group">
        <label for="nomorAntrean">Input Nomor Antrean:</label>
        <input type="number" id="nomorAntrean" placeholder="Contoh: 105" min="1">
    </div>

    <button onclick="updateAntreanManual()">Update Nomor Ini</button>

    <div class="status-box" id="statusBox">
        <span id="statusTeks"></span>
    </div>
</div>

<script>
    // 1. INSIALISASI STRUKTUR DATA UTAMA JIKA BELUM ADA
    if (!localStorage.getItem('dataAntrean')) {
        let initialData = {};
        for(let i = 1; i <= 10; i++) {
            let namaLoket = document.getElementById('pilihLoket').options[i-1].value;
            initialData[namaLoket] = "-";
        }
        localStorage.setItem('dataAntrean', JSON.stringify(initialData));
    }

    // PERBAIKAN UTAMA: Memastikan memori hitungan kerja admin langsung siap sedia sejak awal dibuka
    if (!localStorage.getItem('hitunganKerjaLoket')) {
        let initialReport = {};
        for(let i = 1; i <= 10; i++) {
            let namaLoket = document.getElementById('pilihLoket').options[i-1].value;
            initialReport[namaLoket] = 0; // Mulai dari angka 0 laporan
        }
        localStorage.setItem('hitunganKerjaLoket', JSON.stringify(initialReport));
    }

    function cekStatusLoket() {
        let loketTerpilih = document.getElementById('pilihLoket').value;
        let data = JSON.parse(localStorage.getItem('dataAntrean'));
        let statusBox = document.getElementById('statusBox');
        let statusTeks = document.getElementById('statusTeks');

        statusBox.style.display = "block";
        statusTeks.innerHTML = `<strong>${loketTerpilih}</strong> saat ini melayani Nomor: <strong>${data[loketTerpilih]}</strong>`;
    }

    function updateAntreanManual() {
        let loketTerpilih = document.getElementById('pilihLoket').value;
        let nomorInput = document.getElementById('nomorAntrean').value;

        if (nomorInput === "" || nomorInput < 1) {
            alert("Silakan masukkan nomor antrean yang valid!");
            return;
        }

        let nomorAngka = parseInt(nomorInput);

        // A. UPDATE NOMOR LOKET AKTIF
        let dataLoket = JSON.parse(localStorage.getItem('dataAntrean'));
        dataLoket[loketTerpilih] = nomorAngka;
        localStorage.setItem('dataAntrean', JSON.stringify(dataLoket));

        // B. INPUT SCORE REKAP LAPORAN ADMIN (DIAMBIL SECARA AMAN)
        let hitunganKerja = JSON.parse(localStorage.getItem('hitunganKerjaLoket'));
        if (!hitunganKerja) {
            hitunganKerja = {};
        }
        if (!hitunganKerja[loketTerpilih]) {
            hitunganKerja[loketTerpilih] = 0;
        }
        
        hitunganKerja[loketTerpilih] += 1; // Ditambah 1 rekap kerja setiap klik update sukses
        localStorage.setItem('hitunganKerjaLoket', JSON.stringify(hitunganKerja));

        // C. POTONG NOMOR DARI DAFTAR RUANGAN JIKA ADA
        let dataRuangan = localStorage.getItem('nomorDalamRuangan');
        if (dataRuangan) {
            let listNomor = JSON.parse(dataRuangan);
            let index = listNomor.indexOf(nomorAngka);
            if (index !== -1) {
                listNomor.splice(index, 1);
                localStorage.setItem('nomorDalamRuangan', JSON.stringify(listNomor));
            }
        }
        
        // Kirim sinyal broadcast agar halaman admin dan monitor langsung bergeser angkanya
        localStorage.setItem('antreanUpdated', Date.now()); 
        
        document.getElementById('nomorAntrean').value = ""; 
        cekStatusLoket();
    }

    cekStatusLoket();
</script>
</body>
</html>
