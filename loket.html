<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Antrean - Panel Loket</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 500px; margin: 40px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        select, input, button { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        select:focus, input:focus { border-color: #3498db; outline: none; }
        
        button { background-color: #3498db; color: white; border: none; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        button:hover { background-color: #2980b9; }
        
        .btn-break { background-color: #e74c3c; margin-top: 10px; }
        .btn-break:hover { background-color: #c0392b; }

        .status-box { margin-top: 20px; padding: 15px; background: #e8f4f8; border-left: 5px solid #3498db; border-radius: 4px; display: block; }
    </style>
</head>
<body>

<div class="container">
    <h2>Panggil Antrean (Panel Loket)</h2>
    
    <div class="form-group">
        <label for="pilihLoket">Pilih Loket:</label>
        <select id="pilihLoket" onchange="cekStatusLoket()">
            <option value="Loket A / 1">Loket A / 1</option>
            <option value="Loket B / 2">Loket B / 2</option>
            <option value="Loket C / 3">Loket C / 3</option>
            <option value="Loket D / 4">Loket D / 4</option>
            <option value="Loket E / 5">Loket E / 5</option>
            <option value="Loket F / 6">Loket F / 6</option>
            <option value="Loket G / 7">Loket G / 7</option>
            <option value="Loket H / 8">Loket H / 8</option>
            <option value="Loket I / 9">Loket I / 9</option>
            <option value="Loket J / 10">Loket J / 10</option>
        </select>
    </div>

    <div class="form-group">
        <label for="nomorAntrean">Input Nomor Antrean:</label>
        <input type="number" id="nomorAntrean" placeholder="Contoh: 105" min="1">
    </div>

    <button onclick="updateAntreanManual()">Update Nomor Ini</button>
    <button class="btn-break" onclick="kosongkanStatusLoket()">Istirahat / Kosongkan Loket</button>

    <div class="status-box" id="statusBox">
        <span id="statusTeks">Menghubungkan ke database...</span>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
    const firebaseConfig = {
        databaseURL: "https://antrean-loket-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let dataLoketLokal = null;

    db.ref('dataAntrean').on('value', (snapshot) => {
        let data = snapshot.val();
        
        if (!data) {
            let initialData = {};
            const selectElement = document.getElementById('pilihLoket');
            for(let i = 0; i < selectElement.options.length; i++) {
                initialData[selectElement.options[i].value] = "-";
            }
            db.ref('dataAntrean').set(initialData);
            dataLoketLokal = initialData;
        } else {
            dataLoketLokal = data;
        }
        
        cekStatusLoket();
    });

    function cekStatusLoket() {
        let loketTerpilih = document.getElementById('pilihLoket').value;
        let statusTeks = document.getElementById('statusTeks');

        if (!dataLoketLokal) {
            statusTeks.innerHTML = "Memuat status antrean terbaru...";
            return;
        }

        // Konversi nama loket agar aman saat mencari data di Firebase
        let keyFirebase = btoa(loketTerpilih).replace(/=/g, "");
        let nomor = dataLoketLokal[keyFirebase] !== undefined ? dataLoketLokal[keyFirebase] : "-";
        
        statusTeks.innerHTML = `<strong>${loketTerpilih}</strong> saat ini melayani Nomor: <strong>${nomor}</strong>`;
    }

    function updateAntreanManual() {
        let loketTerpilih = document.getElementById('pilihLoket').value;
        let nomorInput = document.getElementById('nomorAntrean').value;

        if (nomorInput === "" || nomorInput < 1) {
            alert("Silakan masukkan nomor antrean yang valid!");
            return;
        }

        let nomorAngka = parseInt(nomorInput);
        let keyFirebase = btoa(loketTerpilih).replace(/=/g, "");

        // A. Update nomor ke Firebase
        db.ref('dataAntrean/' + keyFirebase).set(nomorAngka);

        // B. Tambah poin laporan admin
        db.ref('hitunganKerjaLoket/' + keyFirebase).transaction((currentValue) => {
            return (currentValue || 0) + 1;
        });

        // C. Potong dari daftar ruangan
        db.ref('nomorDalamRuangan').once('value').then((snapshot) => {
            let listNomor = snapshot.val() || [];
            let index = listNomor.indexOf(nomorAngka);
            if (index !== -1) {
                listNomor.splice(index, 1);
                db.ref('nomorDalamRuangan').set(listNomor);
            }
        });

        document.getElementById('nomorAntrean').value = ""; 
    }

    function kosongkanStatusLoket() {
        let loketTerpilih = document.getElementById('pilihLoket').value;
        let keyFirebase = btoa(loketTerpilih).replace(/=/g, "");
        
        if (confirm(`Kosongkan status pelayanan untuk ${loketTerpilih}?`)) {
            db.ref('dataAntrean/' + keyFirebase).set("-");
        }
    }
</script>
</body>
</html>
