<div class="bg-white p-6 rounded-lg shadow-md mb-6">
    <h2 class="text-xl font-bold mb-4">Input Rentang Nomor (Massal)</h2>
    <div class="flex gap-4">
        <input type="number" id="dari" placeholder="Dari No" class="border p-2 rounded w-full">
        <input type="number" id="sampai" placeholder="Sampai No" class="border p-2 rounded w-full">
        <button onclick="inputMassal()" class="bg-blue-600 text-white px-4 py-2 rounded">Generate</button>
    </div>
</div>

<div class="bg-white p-6 rounded-lg shadow-md">
    <h2 class="text-xl font-bold mb-4">Input Nomor Susulan (Satu per Satu)</h2>
    <div class="flex gap-4">
        <input type="number" id="nomor_tunggal" placeholder="Masukkan 1 Nomor" class="border p-2 rounded w-full">
        <button onclick="inputTunggal()" class="bg-green-600 text-white px-4 py-2 rounded">Tambahkan</button>
    </div>
</div>
