<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Loket Antrean</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Segoe UI,sans-serif;background:linear-gradient(135deg,#0f172a,#1e3a8a);min-height:100vh;padding:20px}
.container{max-width:650px;margin:auto;background:#fff;border-radius:20px;padding:35px;box-shadow:0 15px 40px rgba(0,0,0,.25)}
h1{text-align:center;color:#1e293b;margin-bottom:10px}
.subjudul{text-align:center;color:#64748b;margin-bottom:30px}
.form-group{margin-bottom:20px}
label{display:block;margin-bottom:8px;font-weight:bold}
select,input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}
.btn{width:100%;padding:15px;border:none;border-radius:10px;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px}
.btn-update{background:#2563eb}
.btn-kosong{background:#dc2626}
.status-box{margin-top:25px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border-radius:15px;padding:25px;text-align:center}
.nama-loket{font-size:24px;font-weight:bold}
.nomor-besar{font-size:72px;font-weight:bold;margin:15px 0}
.firebase-status,.pesan{margin-top:15px;text-align:center;font-weight:bold}
</style>
</head>
<body>
<div class="container">
<h1>🏢 Sistem Antrean Online <br> SPMB SMANEGA 2026</h1>
<div class="subjudul">Panel Operator Loket</div>

<div class="form-group">
<label>Pilih Loket</label>
<select id="pilihLoket" onchange="cekStatusLoket()">
<option value="Loket A - 1">Loket A / 1</option>
<option value="Loket B - 2">Loket B / 2</option>
<option value="Loket C - 3">Loket C / 3</option>
<option value="Loket D - 4">Loket D / 4</option>
<option value="Loket E - 5">Loket E / 5</option>
<option value="Loket F - 6">Loket F / 6</option>
<option value="Loket G - 7">Loket G / 7</option>
<option value="Loket H - 8">Loket H / 8</option>
<option value="Loket I - 9">Loket I / 9</option>
<option value="Loket J - 10">Loket J / 10</option>
</select>
</div>

<div class="form-group">
<label>Nomor Antrean</label>
<input type="number" id="nomorAntrean" placeholder="Masukkan nomor antrean">
</div>

<button class="btn btn-update" onclick="updateAntreanManual()">🚀 UPDATE ANTREAN</button>
<button class="btn btn-kosong" onclick="kosongkanLoket()">🗑️ KOSONGKAN LOKET</button>

<div class="status-box">
<div class="nama-loket" id="namaLoket">Loket A / 1</div>
<div class="nomor-besar" id="nomorAktif">-</div>
<div>Sedang Dilayani</div>
</div>

<div class="firebase-status" id="firebaseStatus">🔄 Menghubungkan ke Firebase...</div>
<div class="pesan" id="pesan"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
const firebaseConfig={
 databaseURL:"https://antrean-loket-default-rtdb.asia-southeast1.firebasedatabase.app/"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.database();
let dataLoketLokal={};

db.ref(".info/connected").on("value",(snap)=>{
 document.getElementById("firebaseStatus").innerHTML =
 snap.val() ? "🟢 Terhubung ke System" : "🔴 Tidak Terhubung";
});

db.ref("dataAntrean").on("value",(snapshot)=>{
 dataLoketLokal=snapshot.val()||{};
 cekStatusLoket();
});

function cekStatusLoket(){
 let loket=document.getElementById("pilihLoket").value;
 let nomor=dataLoketLokal[loket]||"-";
 document.getElementById("namaLoket").innerText=loket.replace(/-/g,"/");
 document.getElementById("nomorAktif").innerText=nomor;
}

function tampilPesan(teks,warna){
 const p=document.getElementById("pesan");
 p.style.color=warna;
 p.innerText=teks;
 setTimeout(()=>p.innerText="",3000);
}

function updateAntreanManual(){
 let loket=document.getElementById("pilihLoket").value;
 let nomor=document.getElementById("nomorAntrean").value;

 if(nomor===""||nomor<1){
   alert("Masukkan nomor yang valid!");
   return;
 }

 nomor=parseInt(nomor);

 // 1. Update nomor di loket aktif
 db.ref("dataAntrean/"+loket).set(nomor)
 .then(()=>{
   tampilPesan("✅ Nomor berhasil diperbarui","green");
   document.getElementById("nomorAntrean").value="";
 })
 .catch(err=>{
   tampilPesan("❌ Gagal menyimpan data","red");
   console.error(err);
 });

 // 2. Otomatis hapus nomor ini dari daftar 'nomorDalamRuangan' di Firebase agar tidak balik lagi
 db.ref("nomorDalamRuangan").once("value").then((snapshot) => {
   let listNomor = snapshot.val() || [];
   if (listNomor.includes(nomor)) {
     let listBaru = listNomor.filter(n => n !== nomor);
     db.ref("nomorDalamRuangan").set(listBaru);
   }
 });

 db.ref("hitunganKerjaLoket/"+loket)
 .transaction(current=>(current||0)+1);
}

function kosongkanLoket(){
 let loket=document.getElementById("pilihLoket").value;
 let nomorAktifSekarang = dataLoketLokal[loket];

 if(!confirm("Yakin ingin mengosongkan antrean pada "+loket+" ?")) return;

 // 1. Hapus nomor aktif dari daftar ruang tunggu terlebih dahulu sebelum loket dikosongkan
 if(nomorAktifSekarang && nomorAktifSekarang !== "-") {
   let nomorAngka = parseInt(nomorAktifSekarang);
   db.ref("nomorDalamRuangan").once("value").then((snapshot) => {
     let listNomor = snapshot.val() || [];
     if (listNomor.includes(nomorAngka)) {
       let listBaru = listNomor.filter(n => n !== nomorAngka);
       db.ref("nomorDalamRuangan").set(listBaru);
     }
   });
 }

 // 2. Kosongkan loket di Firebase
 db.ref("dataAntrean/"+loket).set(null)
 .then(()=>tampilPesan("🗑️ Antrean berhasil dikosongkan","orange"))
 .catch(err=>{
   tampilPesan("❌ Gagal mengosongkan antrean","red");
   console.error(err);
 });
}

cekStatusLoket();
</script>
</body>
</html>
