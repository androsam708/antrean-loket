<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Tampilan Antrean Utama</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f6f9; color: #2c3e50; margin: 0; padding: 20px; box-sizing: border-box;}
        h1 { text-align: center; color: #2c3e50; margin-bottom: 25px; font-size: 2.5em; text-transform: uppercase; letter-spacing: 2px; font-weight: 800; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; max-width: 1600px; margin: 0 auto 35px auto; }
        .loket-card { background: #ffffff; border-radius: 14px; box-shadow: 0 6px 18px rgba(0,0,0,0.08); text-align: center; padding: 20px; border: 2px solid #e2e8f0; border-bottom: 8px solid #3498db; }
        .nama-loket { font-size: 2em; font-weight: 900; color: #1a365d; margin-bottom: 10px; background: #ebf8ff; padding: 10px; border-radius: 8px; letter-spacing: 1px; }
        .nomor-antrean { font-size: 4.5em; font-weight: 800; margin: 5px 0; font-family: 'Segoe UI', Arial, sans-serif; }
        .label-terlayani { font-size: 0.9em; color: #718096; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; }
        .ruangan-container { max-width: 1600px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 14px; box-shadow: 0 6px 18px rgba(0,0,0,0.08); border: 2px solid #e2e8f0; border-left: 10px solid #28a745; }
        .ruangan-title { font-size: 1.6em; font-weight: 800; text-transform: uppercase; margin-bottom: 15px; color: #212529; letter-spacing: 1px; }
        .ruangan-content { font-size: 2.2em; line-height: 1.5; background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0; min-height: 60px; word-break: break-all; color: #000000; font-weight: 800; }
        footer { text-align: center; margin-top: 30px; color: #a0aec0; font-size: 0.95em; font-weight: 500; }
    </style>
</head>
<body>

    <h1>Tampilan Monitor Utama</h1>
    <div class="grid-container" id="monitorGrid"></div>

    <div class="ruangan-container">
        <div class="ruangan-title">Nomor Antrean yang Masuk / Berada di Dalam Ruangan:</div>
        <div class="ruangan-content" id="ruanganList">Memuat data...</div>
    </div>

    <footer>Sistem Informasi Antrean Loket Digital Terintegrasi</footer>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
    const firebaseConfig = { databaseURL: "https://antrean-loket-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const listNamaLoket = [
        "Loket A - 1", "Loket B - 2", "Loket C - 3", "Loket D - 4", "Loket E - 5",
        "Loket F - 6", "Loket G - 7", "Loket H - 8", "Loket I - 9", "Loket J - 10"
    ];

    // Realtime Render Loket
    db.ref('dataAntrean').on('value', (snapshot) => {
        let data = snapshot.val() || {};
        let grid = document.getElementById('monitorGrid');
        grid.innerHTML = "";

        listNamaLoket.forEach(loket => {
            let nomor = data[loket] || "-";
            let card = document.createElement('div');
            card.className = 'loket-card';
            let warnaNomor = (nomor === "-") ? "#c53030" : "#22543d";

            card.innerHTML = `
                <div class="nama-loket">${loket.replace(/-/g, '/')}</div>
                <div class="label-terlayani">Sedang Dilayani</div>
                <div class="nomor-antrean" style="color: ${warnaNomor}">${nomor}</div>
            `;
            grid.appendChild(card);
        });
    });

    // Realtime Render Daftar Ruangan
    db.ref('nomorDalamRuangan').on('value', (snapshot) => {
        let dataRuangan = snapshot.val() || [];
        let ruanganBox = document.getElementById('ruanganList');
        
        if (dataRuangan.length === 0) {
            ruanganBox.innerHTML = "<span style='color:#a0aec0; font-style: italic; font-size:0.7em; font-weight:normal;'>Belum ada nomor yang dipanggil masuk ruangan</span>";
        } else {
            ruanganBox.innerText = dataRuangan.join(', ');
        }
    });
</script>
</body>
</html>
