<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Nomor Masuk Ruangan</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 30px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; }
        .section-box { border: 1px solid #e0e0e0; padding: 20px; border-radius: 8px; margin-bottom: 20px; background: #fafafa; }
        button { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; background-color: #e74c3c; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <h2>Sistem Reset Database Terpusat</h2>
    <div class="section-box">
        <p>Gunakan tombol di bawah ini jika ingin membersihkan total seluruh nomor antrean yang tersangkut di internet agar kembali bersih ke tanda minus (-).</p>
        <button onclick="bersihkanTotalDatabase()">Bersihkan Seluruh Memory Database</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
    const firebaseConfig = { databaseURL: "https://antrean-loket-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function bersihkanTotalDatabase() {
        if(confirm("Apakah Anda yakin ingin menyapu bersih semua data antrean?")) {
            let dataBersih = {
                "Loket_A_1": "-", "Loket_B_2": "-", "Loket_C_3": "-", "Loket_D_4": "-", "Loket_E_5": "-",
                "Loket_F_6": "-", "Loket_G_7": "-", "Loket_H_8": "-", "Loket_I_9": "-", "Loket_J_10": "-"
            };
            db.ref('dataAntrean').set(dataBersih);
            db.ref('hitunganKerjaLoket').set(null);
            alert("Database dibersihkan!");
        }
    }
</script>
</body>
</html>
