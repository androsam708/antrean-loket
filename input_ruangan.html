<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Nomor Masuk Ruangan</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 30px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; }
        .section-box { border: 1px solid #e0e0e0; padding: 20px; border-radius: 8px; margin-bottom: 20px; background: #fafafa; }
        h3 { margin-top: 0; color: #2980b9; font-size: 1.1em; border-bottom: 2px solid #3498db; padding-bottom: 5px; }
        .form-group { margin-bottom: 15px; }
        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #555; font-size: 0.9em; }
        input, button { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        input:focus { border-color: #3498db; outline: none; }
        button { background-color: #3498db; color: white; border: none; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 5px; }
        button:hover { background-color: #2980b9; }
        .btn-danger { background-color: #e74c3c; }
        .btn-danger:hover { background-color: #c0392b; }
        .btn-orange { background-color: #e67e22; color: white; }
        .btn-orange:hover { background-color: #d35400; }
        
        .list-preview { 
            max-height: 200px; 
            overflow-y: auto; 
            background: #edf2f7; 
            padding: 15px; 
            border-radius: 6px; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            font-size: 26px;       
            font-weight: 800;      
            color: #2c3e50; 
            line-height: 1.5;
            letter-spacing: 1px;
            word-break: break-all; 
            margin-top: 10px; 
        }
        .list-preview em { font-size: 16px; font-weight: normal; color: #7f8c8d; }
        .petunjuk { font-size: 0.85em; color: #7f8c8d; margin-top: 5px; display: block; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h2>Manajemen Nomor Masuk Ruangan</h2>
    
    <div class="section-box">
        <h3>1. Input Rentang Nomor (Masuk Masal)</h3>
        <div class="form-row">
            <div class="form-group">
                <label for="rangeDari">Dari Nomor:</label>
                <input type="number" id="rangeDari" placeholder="Contoh: 20" min="1">
            </div>
            <div class="form-group">
                <label for="rangeSampai">Sampai Nomor:</label>
                <input type="number" id="rangeSampai" placeholder="Contoh: 50" min="1">
            </div>
        </div>
        <button onclick="tambahRangeNomor()">Masukkan Rentang Nomor</button>
    </div>

    <div class="section-box">
        <h3>2. Input Nomor Tertentu (Sisipan / Terlewat)</h3>
        <div class="form-group">
            <label for="nomorSpesifik">Masukkan Nomor:</label>
            <input type="text" id="nomorSpesifik" placeholder="Contoh: 9, 12, 15 atau 9 12 15">
            <span class="petunjuk">*Bisa memasukkan banyak nomor sekaligus dipisah koma atau spasi.</span>
        </div>
        <button onclick="tambahNomorSpesifik()">Masukkan Semua Nomor Ini</button>
    </div>

    <div class="section-box">
        <h3>Nomor yang Berada di Dalam Ruangan Saat Ini:</h3>
        <div class="list-preview" id="previewNomor">-</div>
        
        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button class="btn-danger" onclick="kosongkanRuangan()" style="flex: 1;">Kosongkan Daftar</button>
            <button class="btn-orange" onclick="paksaResetSistem()" style="flex: 1;">Tombol Darurat (Reset Sistem)</button>
        </div>
    </div>
</div>

<script>
    function ambilDataRuangan() {
        let data = localStorage.getItem('nomorDalamRuangan');
        if (!data) return [];
        try {
            let parsed = JSON.parse(data);
            return Array.isArray(parsed) ? parsed : [];
        } catch(e) {
            return [];
        }
    }

    function perbaruiPreview() {
        let urutanNomor = ambilDataRuangan();
        let previewBox = document.getElementById('previewNomor');
        
        if(urutanNomor.length === 0) {
            previewBox.innerHTML = "<em>Tidak ada nomor di dalam ruangan.</em>";
        } else {
            let angkaBersih = urutanNomor.map(n => parseInt(n)).filter(n => !isNaN(n));
            previewBox.innerText = angkaBersih.join(', ');
        }
    }

    function tambahRangeNomor() {
        let dari = parseInt(document.getElementById('rangeDari').value);
        let sampai = parseInt(document.getElementById('rangeSampai').value);

        if (isNaN(dari) || isNaN(sampai) || dari < 1 || sampai < 1) {
            alert("Harap isi kedua nomor rentang dengan benar!");
            return;
        }
        if (dari > sampai) {
            alert("Nomor 'Dari' tidak boleh lebih besar dari nomor 'Sampai'!");
            return;
        }

        let dataSekarang = ambilDataRuangan();
        for (let i = dari; i <= sampai; i++) {
            if (!dataSekarang.includes(i)) {
                dataSekarang.push(i);
            }
        }
        
        simpanData(dataSekarang);
        document.getElementById('rangeDari').value = "";
        document.getElementById('rangeSampai').value = "";
    }

    function tambahNomorSpesifik() {
        let inputTeks = document.getElementById('nomorSpesifik').value;

        if (!inputTeks || inputTeks.trim() === "") {
            alert("Silakan masukkan nomor terlebih dahulu!");
            return;
        }

        let potonganNomor = inputTeks.split(/[\s,]+/);
        let dataSekarang = ambilDataRuangan();
        let adaNomorBaru = false;

        potonganNomor.forEach(item => {
            if(item.trim() !== "") {
                let nomor = parseInt(item.trim());
                if (!isNaN(nomor) && nomor > 0) {
                    if (!dataSekarang.includes(nomor)) {
                        dataSekarang.push(nomor);
                        adaNomorBaru = true;
                    }
                }
            }
        });

        if (!adaNomorBaru) {
            alert("Tidak ada nomor baru yang valid atau nomor sudah dimasukkan.");
            return;
        }

        simpanData(dataSekarang);
        document.getElementById('nomorSpesifik').value = ""; 
    }

    function simpanData(data) {
        let dataAngka = data.map(n => parseInt(n)).filter(n => !isNaN(n));
        dataAngka.sort((a, b) => a - b);
        
        localStorage.setItem('nomorDalamRuangan', JSON.stringify(dataAngka));
        localStorage.setItem('antreanUpdated', Date.now()); 
        perbaruiPreview();
    }

    function kosongkanRuangan() {
        if(confirm("Apakah Anda yakin ingin mengosongkan semua daftar nomor?")) {
            simpanData([]);
        }
    }

    function paksaResetSistem() {
        localStorage.setItem('nomorDalamRuangan', JSON.stringify([]));
        localStorage.setItem('antreanUpdated', Date.now());
        perbaruiPreview();
        alert("Sistem berhasil di-reset bersih!");
    }

    // LISTENER OTOMATIS: Jika halaman loket menghapus nomor, halaman ini ikut update visualnya tanpa refresh
    window.addEventListener('storage', function(e) {
        if (e.key === 'nomorDalamRuangan' || e.key === 'antreanUpdated') {
            perbaruiPreview();
        }
    });

    perbaruiPreview();
</script>
</body>
</html>
